<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 904" width="900" height="904" role="img" aria-label="Two steps to open a past observation. Step one: on the iObservation home page, find the card called Observations conducted on me and click View. Step two: your own list opens, every row shows your own name, so click View on the observation you want." font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="900" height="904" fill="#ffffff"/><text x="30" y="38" font-size="13" fill="#6E6A64" font-weight="bold" letter-spacing="1.5">HOW TO OPEN A PAST OBSERVATION</text><line x1="30" y1="50" x2="870" y2="50" stroke="#e2e2dd"/><circle cx="46" cy="96" r="16" fill="#2a2a2a"/><text x="46" y="102" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="76" y="90" font-size="16" fill="#1b1b1b" font-weight="bold">On the iObservation home page, find the card</text><text x="76" y="111" font-size="16" fill="#1b1b1b" font-weight="bold">called Observations conducted on me.</text><rect x="76" y="132" width="700" height="292" rx="8" fill="#ffffff" stroke="#d8d8d2"/><rect x="76" y="132" width="700" height="34" rx="8" fill="#f4f4f0"/><rect x="76" y="158" width="700" height="8" fill="#f4f4f0"/><circle cx="96" cy="149" r="5" fill="#dcdcd6"/><circle cx="114" cy="149" r="5" fill="#dcdcd6"/><circle cx="132" cy="149" r="5" fill="#dcdcd6"/><rect x="150" y="141" width="300" height="17" rx="8" fill="#ffffff" stroke="#e2e2dd"/><text x="162" y="153" font-size="11" fill="#8b8880">ieobservation.com</text><text x="736" y="153" font-size="11" fill="#8b8880" font-weight="bold" text-anchor="middle">Home</text><rect x="100" y="184" width="652" height="216" rx="6" fill="#ffffff" stroke="#e2e2dd"/><text x="120" y="212" font-size="16" fill="#0f2a1f" font-weight="bold">Observations conducted on me</text><line x1="120" y1="226" x2="732" y2="226" stroke="#eeeee9"/><text x="120" y="246" font-size="10" fill="#8b8880" font-weight="bold" letter-spacing="0.8">OBSERVER</text><text x="560" y="246" font-size="10" fill="#8b8880" font-weight="bold" letter-spacing="0.8">DATE COMPLETED</text><rect x="112" y="253" width="628" height="28" fill="#fafaf7"/><circle cx="128" cy="266" r="9" fill="#e8f0ea"/><text x="128" y="270" font-size="9" fill="#0f2a1f" font-weight="bold" text-anchor="middle">RE</text><text x="146" y="271" font-size="13" fill="#1b1b1b">R. Example</text><text x="560" y="271" font-size="13" fill="#6E6A64">Aug 26, 2026</text><circle cx="128" cy="296" r="9" fill="#e8f0ea"/><text x="128" y="300" font-size="9" fill="#0f2a1f" font-weight="bold" text-anchor="middle">MP</text><text x="146" y="301" font-size="13" fill="#1b1b1b">M. Placeholder</text><text x="560" y="301" font-size="13" fill="#6E6A64">May 20, 2026</text><rect x="112" y="313" width="628" height="28" fill="#fafaf7"/><circle cx="128" cy="326" r="9" fill="#e8f0ea"/><text x="128" y="330" font-size="9" fill="#0f2a1f" font-weight="bold" text-anchor="middle">TS</text><text x="146" y="331" font-size="13" fill="#1b1b1b">T. Specimen</text><text x="560" y="331" font-size="13" fill="#6E6A64">Aug 27, 2024</text><text x="146" y="362" font-size="12" fill="#8b8880">…and every older one, going back years.</text><rect x="620" y="344" width="96" height="30" rx="6" fill="#0f2a1f"/><text x="668" y="364" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle">View</text><rect x="612" y="336" width="112" height="46" rx="10" fill="none" stroke="#C11430" stroke-width="2.5"/><rect x="332.0" y="440" width="236" height="32" rx="16" fill="#C11430"/><text x="450" y="461" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">Click View on that card</text><circle cx="46" cy="532" r="16" fill="#2a2a2a"/><text x="46" y="538" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="76" y="526" font-size="16" fill="#1b1b1b" font-weight="bold">Your own list opens — every row has your</text><text x="76" y="547" font-size="16" fill="#1b1b1b" font-weight="bold">name on it. Click View on the one you want.</text><rect x="76" y="576" width="700" height="238" rx="8" fill="#ffffff" stroke="#d8d8d2"/><rect x="76" y="576" width="700" height="34" rx="8" fill="#f4f4f0"/><rect x="76" y="602" width="700" height="8" fill="#f4f4f0"/><circle cx="96" cy="593" r="5" fill="#dcdcd6"/><circle cx="114" cy="593" r="5" fill="#dcdcd6"/><circle cx="132" cy="593" r="5" fill="#dcdcd6"/><rect x="150" y="585" width="300" height="17" rx="8" fill="#ffffff" stroke="#e2e2dd"/><text x="162" y="597" font-size="11" fill="#8b8880">ieobservation.com</text><text x="736" y="597" font-size="11" fill="#8b8880" font-weight="bold" text-anchor="middle">Observations</text><text x="100" y="634" font-size="14" fill="#a9a7a2">Conduct</text><text x="186" y="634" font-size="14" fill="#0f2a1f" font-weight="bold">Completed Observations</text><line x1="186" y1="644" x2="382" y2="644" stroke="#0f2a1f" stroke-width="3"/><line x1="76" y1="644" x2="776" y2="644" stroke="#eeeee9"/><text x="100" y="666" font-size="10" fill="#8b8880" font-weight="bold" letter-spacing="0.8">NAME</text><text x="262" y="666" font-size="10" fill="#8b8880" font-weight="bold" letter-spacing="0.8">OBSERVER</text><text x="404" y="666" font-size="10" fill="#8b8880" font-weight="bold" letter-spacing="0.8">TYPE</text><text x="478" y="666" font-size="10" fill="#8b8880" font-weight="bold" letter-spacing="0.8">DATE SUBMITTED</text><rect x="88" y="677" width="676" height="28" fill="#fdf0f2"/><circle cx="106" cy="690" r="9" fill="#e8f0ea"/><text x="106" y="694" font-size="9" fill="#0f2a1f" font-weight="bold" text-anchor="middle">AS</text><text x="124" y="695" font-size="13" fill="#1b1b1b" font-weight="bold">A. Sample</text><text x="262" y="695" font-size="13" fill="#1b1b1b">R. Example</text><text x="404" y="695" font-size="13" fill="#1b1b1b">Formal</text><text x="478" y="695" font-size="13" fill="#1b1b1b">September 16, 2026</text><text x="704" y="695" font-size="13" fill="#C11430" font-weight="bold" text-anchor="middle">View</text><circle cx="106" cy="720" r="9" fill="#e8f0ea"/><text x="106" y="724" font-size="9" fill="#0f2a1f" font-weight="bold" text-anchor="middle">AS</text><text x="124" y="725" font-size="13" fill="#1b1b1b" font-weight="bold">A. Sample</text><text x="262" y="725" font-size="13" fill="#1b1b1b">M. Placeholder</text><text x="404" y="725" font-size="13" fill="#1b1b1b">Formal</text><text x="478" y="725" font-size="13" fill="#1b1b1b">May 20, 2026</text><text x="704" y="725" font-size="13" fill="#C11430" font-weight="bold" text-anchor="middle">View</text><rect x="88" y="737" width="676" height="28" fill="#fafaf7"/><circle cx="106" cy="750" r="9" fill="#e8f0ea"/><text x="106" y="754" font-size="9" fill="#0f2a1f" font-weight="bold" text-anchor="middle">AS</text><text x="124" y="755" font-size="13" fill="#1b1b1b" font-weight="bold">A. Sample</text><text x="262" y="755" font-size="13" fill="#1b1b1b">T. Specimen</text><text x="404" y="755" font-size="13" fill="#1b1b1b">N/A</text><text x="478" y="755" font-size="13" fill="#1b1b1b">August 27, 2024</text><text x="704" y="755" font-size="13" fill="#C11430" font-weight="bold" text-anchor="middle">View</text><rect x="666" y="677" width="76" height="30" rx="8" fill="none" stroke="#C11430" stroke-width="2.5"/><text x="124" y="788" font-size="12" fill="#8b8880">Your own name on every row is how you know it is your list.</text><rect x="316.0" y="830" width="268" height="32" rx="16" fill="#C11430"/><text x="450" y="851" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">Click View on the row you want</text><text x="450" y="892" font-size="15" fill="#0f2a1f" font-weight="bold" text-anchor="middle">The report opens. Now click Observation Digest on your bookmarks bar.</text></svg>
